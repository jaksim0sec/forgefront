<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10161c">
  <title>FORGEFRONT — World Foundation</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <main class="game" aria-label="FORGEFRONT 월드 및 구조물 배치 테스트">
    <svg id="world" class="world" xmlns="http://www.w3.org/2000/svg" aria-label="타일 보드">
      <defs>
        <pattern id="tile-grid" patternUnits="userSpaceOnUse" width="48" height="48">
          <path id="tile-grid-path" d="M48 0H0V48" fill="none" stroke="#8796a5" stroke-opacity=".12" stroke-width="1"/>
        </pattern>
        <pattern id="sector-grid" patternUnits="userSpaceOnUse" width="384" height="384">
          <path id="sector-grid-path" d="M384 0H0V384" fill="none" stroke="#8796a5" stroke-opacity=".28" stroke-width="1.25"/>
        </pattern>
        <radialGradient id="ambient" cx="50%" cy="45%" r="75%">
          <stop offset="0%" stop-color="#1c2831"/>
          <stop offset="100%" stop-color="#111920"/>
        </radialGradient>
      </defs>
      <rect width="100%" height="100%" fill="url(#ambient)"/>
      <rect width="100%" height="100%" fill="url(#tile-grid)"/>
      <rect width="100%" height="100%" fill="url(#sector-grid)"/>
      <g id="world-origin" pointer-events="none">
        <circle r="14" fill="#f4ac54" fill-opacity=".08" stroke="#f4ac54" stroke-opacity=".55"/>
        <path d="M-23 0H23M0 -23V23" stroke="#f4ac54" stroke-width="1.5" stroke-opacity=".75"/>
        <circle r="3" fill="#f4ac54"/>
      </g>
      <g id="structures-layer" pointer-events="none"></g>
      <rect id="tile-highlight" visibility="hidden" fill-opacity=".18" stroke-width="2" pointer-events="none"/>
    </svg>
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">⬡</span><strong>FORGEFRONT</strong><span class="version">WORLD / 02</span></div>
      <div class="phase">SPARSE WORLD <span class="live-dot"></span> ACTIVE</div>
    </header>
    <div class="side-label" aria-hidden="true">INDUSTRIAL TERRITORY / FOUNDATION</div>
    <div class="center-crosshair" aria-hidden="true"></div>
    <aside class="toolbox" aria-label="구조물 설치 도구">
      <div class="toolbox-heading">BUILD / EDIT <span>R ↻</span></div>
      <div class="tool-list">
        <button type="button" data-tool="select" aria-pressed="true"><span class="tool-icon">⌖</span><span>선택</span><kbd>V</kbd></button>
        <button type="button" data-tool="conveyor" aria-pressed="false"><span class="tool-icon">⇥</span><span>컨베이어</span><kbd>1</kbd></button>
        <button type="button" data-tool="drill" aria-pressed="false"><span class="tool-icon">⚙</span><span>채굴기</span><kbd>2</kbd></button>
        <button type="button" data-tool="smelter" aria-pressed="false"><span class="tool-icon">▤</span><span>제련소</span><kbd>3</kbd></button>
        <button type="button" data-tool="generator" aria-pressed="false"><span class="tool-icon">ϟ</span><span>발전기</span><kbd>4</kbd></button>
        <button type="button" data-tool="erase" aria-pressed="false"><span class="tool-icon">×</span><span>철거</span><kbd>X</kbd></button>
      </div>
      <button type="button" id="rotate" class="rotate">↻ 회전 <output id="rotation">0°</output></button>
    </aside>
    <footer class="hud">
      <section class="status-panel" aria-label="월드 상태">
        <div class="status-item"><span>CAMERA X / Y</span><div><output id="cam-x">0.0</output><span class="separator"> / </span><output id="cam-y">0.0</output></div></div>
        <div class="status-item"><span>ZOOM</span><output id="zoom">100%</output></div>
        <div class="status-item"><span>TILE</span><output id="tile-coords">—</output></div>
        <div class="status-item"><span>OBJECTS / CHUNKS</span><div><output id="structure-count">0</output><span class="separator"> / </span><output id="chunk-count">0</output></div></div>
      </section>
      <section class="control-panel" aria-label="조작 안내">
        <div class="selection-info" id="selected-info">타일 또는 건물을 선택해 봐</div>
        <div class="desktop-hint">방향키 이동 · 휠 확대 · 클릭 설치 · 우클릭 철거</div>
        <div class="mobile-hint">한 손가락 이동 · 두 손가락 확대 · 탭 설치</div>
        <button id="reset" class="reset" type="button" aria-label="카메라 위치와 확대율 초기화">↺ 초기화</button>
      </section>
    </footer>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
