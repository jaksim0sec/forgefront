<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10161c">
  <meta name="application-name" content="FORGEFRONT">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>FORGEFRONT — World Foundation</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <main class="game" aria-label="FORGEFRONT 산업, 영토 및 방어 게임">
    <svg id="world" class="world" xmlns="http://www.w3.org/2000/svg" aria-label="타일 보드">
      <defs>
        <pattern id="tile-grid" patternUnits="userSpaceOnUse" width="48" height="48">
          <path id="tile-grid-path" d="M48 0H0V48" fill="none" stroke="#8796a5" stroke-opacity=".12" stroke-width="1"/>
        </pattern>
        <pattern id="sector-grid" patternUnits="userSpaceOnUse" width="384" height="384">
          <path id="sector-grid-path" d="M384 0H0V384" fill="none" stroke="#8796a5" stroke-opacity=".28" stroke-width="1.25"/>
        </pattern>
        <radialGradient id="ambient" cx="50%" cy="45%" r="75%">
          <stop offset="0%" stop-color="#1c2831"/>
          <stop offset="100%" stop-color="#111920"/>
        </radialGradient>
      </defs>
      <rect width="100%" height="100%" fill="url(#ambient)"/>
      <g id="terrain-layer" pointer-events="none"></g>
      <g id="territory-layer" pointer-events="none"></g>
      <rect width="100%" height="100%" fill="url(#tile-grid)"/>
      <rect width="100%" height="100%" fill="url(#sector-grid)"/>
      <g id="ore-layer" pointer-events="none"></g>
      <g id="world-origin" pointer-events="none">
        <circle r="14" fill="#f4ac54" fill-opacity=".08" stroke="#f4ac54" stroke-opacity=".55"/>
        <path d="M-23 0H23M0 -23V23" stroke="#f4ac54" stroke-width="1.5" stroke-opacity=".75"/>
        <circle r="3" fill="#f4ac54"/>
      </g>
      <circle id="weapon-radius" visibility="hidden" fill="#d1a77f" fill-opacity=".055" stroke="#dbad78" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="6 8" pointer-events="none"/>
      <circle id="power-radius" visibility="hidden" fill="#e5bf75" fill-opacity=".035" stroke="#e5bf75" stroke-opacity=".4" stroke-width="1.8" stroke-dasharray="8 7" pointer-events="none"/>
      <g id="structures-layer" pointer-events="none"></g>
      <g id="moving-items" pointer-events="none"></g>
      <g id="connections-layer" pointer-events="none"></g>
      <path id="route-preview" visibility="hidden" pointer-events="none"/>
      <rect id="erase-preview" visibility="hidden" fill="#ed7777" fill-opacity=".15" stroke="#ed9999" stroke-width="2" stroke-dasharray="7 4" pointer-events="none"/>
      <rect id="route-block" visibility="hidden" fill="#ef7474" fill-opacity=".24" stroke="#ff9c9c" stroke-width="2" pointer-events="none"/>
      <rect id="tile-highlight" visibility="hidden" fill-opacity=".18" stroke-width="2" pointer-events="none"/>
    </svg>
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">⬡</span><strong>FORGEFRONT</strong><span class="version">WORLD / 07</span></div>
      <div class="phase">TERRITORY / DEFENSE <span class="live-dot"></span> ACTIVE</div>
    </header>
    <div id="selected-info" class="floating-selection" aria-live="polite">타일 또는 건물을 선택해 봐</div>
    <div class="side-label" aria-hidden="true">INDUSTRIAL TERRITORY / FOUNDATION</div>
    <div class="center-crosshair" aria-hidden="true"></div>
    <aside id="toolbox-panel" class="toolbox" aria-label="구조물 설치 도구">
      <div class="toolbox-heading">BUILD / EDIT <span>R ↻</span></div>
      <div class="tool-list">
        <button type="button" data-tool="select" aria-pressed="true"><span class="tool-icon">⌖</span><span>선택</span><kbd>V</kbd></button>
        <button type="button" data-tool="conveyor" aria-pressed="false"><span class="tool-icon">⇥</span><span>컨베이어</span><kbd>1</kbd></button>
        <button type="button" data-tool="junction" aria-pressed="false"><span class="tool-icon">✣</span><span>분배기</span><kbd>5</kbd></button>
        <button type="button" data-tool="leadCollector" aria-pressed="false"><span class="tool-icon">◉</span><span>납 채집기</span><kbd>6</kbd></button>
        <button type="button" data-tool="drill" aria-pressed="false"><span class="tool-icon">⚙</span><span>채굴기</span><kbd>2</kbd></button>
        <button type="button" data-tool="smelter" aria-pressed="false"><span class="tool-icon">▤</span><span>제련소</span><kbd>3</kbd></button>
        <button type="button" data-tool="generator" aria-pressed="false"><span class="tool-icon">ϟ</span><span>발전기</span><kbd>4</kbd></button>
        <button type="button" data-tool="turret" aria-pressed="false"><span class="tool-icon">◉</span>방어 포탑<kbd>0</kbd></button>
        <button type="button" data-tool="poweredDrill" aria-pressed="false"><span class="tool-icon">⚒</span><span>전동 드릴</span><kbd>7</kbd></button>
        <button type="button" data-tool="siliconPlant" aria-pressed="false"><span class="tool-icon">▥</span><span>실리콘 공장</span><kbd>8</kbd></button>
        <button type="button" data-tool="superconductorPlant" aria-pressed="false"><span class="tool-icon">◎</span><span>초전도체 공장</span><kbd>9</kbd></button>
        <button type="button" data-tool="erase" aria-pressed="false"><span class="tool-icon">×</span><span>철거</span><kbd>X</kbd></button>
      </div>
      <button type="button" id="rotate" class="rotate">↻ 회전 <output id="rotation">0°</output></button>
      <div class="owner-heading">국가 각인 / FACTION <span id="nation-status">중립</span></div>
      <div class="owner-swatches" id="owner-swatches" role="group" aria-label="건물 소속 국가">
        <button type="button" class="owner-swatch active" data-owner="neutral" aria-pressed="true">중립</button>
      </div>
      <div class="toolbox-actions">
        <button id="show-links" type="button" aria-pressed="true">↗ 자원 연결 ON</button>
        <button id="show-territory" type="button" aria-pressed="true">◇ 영토 경계 ON</button>
        <button id="touch-draw" type="button" aria-pressed="false">✎ 터치 경로 건설 OFF</button>
        <button id="example" type="button">＋ 철 채굴라인 예시</button>
        <button id="simulate-raid" type="button">◈ 적 정찰 드론 시험</button>
        <button id="reset" type="button" aria-label="카메라 초기화">↺ 카메라 초기화</button>
      </div>
      <div class="owner-heading">국가 비축 물자</div>
      <p class="economy-hint">타워에 전달된 자원으로 시설을 건설해</p>
      <div id="build-message" role="status" class="build-message"></div>
      <div id="resource-list" class="resource-list" aria-label="등록된 자원 6종"></div>
    </aside>
    <section class="build-inspector" id="build-inspector" aria-live="polite" hidden>
      <svg class="build-hero" viewBox="0 0 100 100" aria-hidden="true"><use id="build-preview-sprite" href="#s-conveyor" width="100" height="100"/></svg>
      <h2 class="build-name" id="build-preview-name"></h2>
      <p class="build-description" id="build-preview-description"></p>
      <div class="build-meta">
        <span>크기</span><strong id="build-preview-size"></strong>
        <span>내구도</span><strong id="build-preview-health"></strong>
        <span>건설비</span><strong id="build-preview-cost"></strong>
        <span>전력</span><strong id="build-preview-power"></strong>
      </div>
      <div class="build-hint">선택 후 맵에서 설치 · R 회전</div>
    </section>
    <section class="selection-panel" id="selected-detail" hidden aria-label="선택 구조물 상태">
      <div class="inspector-heading">STRUCTURE STATUS</div>
      <div class="inspector-row"><span>내구도</span><output id="selected-health">—</output></div>
      <div class="inspector-row"><span>가동 상태</span><output id="selected-status">—</output></div>
      <div class="inspector-row"><span>전력</span><output id="selected-power">—</output></div>
      <div class="inspector-row"><span>영토 영향력</span><output id="selected-territory">—</output></div>
      <div class="inspector-row"><span>광맥/생산</span><output id="selected-production">—</output></div>
      <div class="inspector-row"><span>재고</span><output id="selected-stock">—</output></div>
      <label class="inspector-row" id="resource-picker" hidden>채굴 자원 <select id="drill-resource" aria-label="채굴 자원 선택"></select></label>
      <div class="inspector-actions">
        <button type="button" id="toggle-building">가동 전환</button>
        <button type="button" id="damage-building">-25 HP 시험</button>
      </div>
    </section>
    <div id="world-telemetry" hidden aria-hidden="true">
      <output id="cam-x"></output>
      <output id="cam-y"></output>
      <output id="zoom"></output>
      <output id="tile-coords"></output>
      <output id="structure-count"></output>
      <output id="chunk-count"></output>
      <output id="link-count"></output>
      <output id="power-summary"></output>
    </div>
  </main>
  <script type="module" src="./src/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(error => {
          console.warn('FORGEFRONT offline cache unavailable:', error);
        });
      });
    }
  </script>
</body>
</html>
